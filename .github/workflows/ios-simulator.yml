name: iOS simulator build check (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-simulator.yml'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/prepare-ios.mjs'
      - 'scripts/configure-ios.mjs'
      - 'index.html'
      - 'community-guidelines.html'
      - 'privacy.html'
      - 'support.html'
      - '*.js'
      - '*.css'
      - 'icons/**'
      - 'images/**'
      - 'manifest.webmanifest'

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Nightreel
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native iOS project
        run: |
          npm run ios:add
          npm run ios:sync
          node scripts/configure-ios.mjs
      - name: Generate Nightreel iOS icons from existing branding
        run: |
          mkdir -p assets
          sips -z 1024 1024 icons/nightreel-icon-512.png --out assets/icon.png
          npx --yes @capacitor/assets generate --ios --iconBackgroundColor '#17151f'
      - name: Check Xcode project schemes
        run: xcodebuild -list -project ios/App/App.xcodeproj
      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Save simulator build
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: nightreel-ios-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 7
